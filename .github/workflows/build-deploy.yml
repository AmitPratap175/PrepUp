name: Build and Push Images

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push auth_server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./auth_server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/prepup-backend:latest
            ghcr.io/${{ github.repository_owner }}/prepup-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/prepup-frontend:latest
            ghcr.io/${{ github.repository_owner }}/prepup-frontend:${{ github.sha }}
