version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  api_server:
    build:
      context: ./fastapi_server
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_NAME=auth_db
      - DB_USER=user
      - DB_PASS=password
      # It's good practice to not hardcode the secret key
      - SECRET_KEY=my_super_secret_key_for_jwt_tokens
    depends_on:
      - postgres
    command: >
      sh -c "
        echo 'Waiting for postgres...' &&
        while ! nc -z postgres 5432; do
          sleep 0.1;
        done;
        echo 'PostgreSQL started';
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "

volumes:
  postgres_data:
