version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  auth_server:
    build:
      context: ./auth_server
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_NAME=auth_db
      - DB_USER=user
      - DB_PASS=password
    depends_on:
      - postgres
    command: >
      sh -c "
        echo 'Waiting for postgres...' &&
        while ! nc -z postgres 5432; do
          sleep 0.1;
        done;
        echo 'PostgreSQL started';
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "

  server:
    build:
      context: .
    ports:
      - "5000:5000"
    environment:
      - AUTH_SERVER_URL=http://auth_server:8000
    depends_on:
      - auth_server

volumes:
  postgres_data:
