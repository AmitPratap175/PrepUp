services:
  postgres:
    image: docker.io/library/postgres:17
    # container_name: postgres_prepup
    environment:
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - ./pg_data_new:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  auth_server:
    build:
      context: .
      dockerfile: auth_server/Dockerfile
    # container_name: prepup_backend
    ports:
      - "8000:8000"
    volumes:
      - ./auth_server/data:/app/data:z
    env_file:
      - ./auth_server/.env
    environment:
      - DB_HOST=postgres
      - DB_NAME=auth_db
      - DB_USER=user
      - DB_PASS=password
    depends_on:
      - postgres
    command: >
      sh -c "
        echo 'Waiting for postgres...' &&
        while ! nc -z postgres 5432; do
          sleep 0.1;
        done;
        echo 'PostgreSQL started';
        sleep 2;
        until python manage.py migrate; do
          echo 'Migration failed, retrying in 2s...';
          sleep 2;
        done;
        python manage.py runserver 0.0.0.0:8000
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # container_name: prepup_frontend
    depends_on:
      - auth_server
    ports:
      - "5000:5000"
    command: nginx -g 'daemon off;'

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  celery_worker:
    build:
      context: .
      dockerfile: auth_server/Dockerfile
    volumes:
      - ./auth_server/data:/app/data:z
    env_file:
      - ./auth_server/.env
    environment:
      - DB_HOST=postgres
      - DB_NAME=auth_db
      - DB_USER=user
      - DB_PASS=password
    depends_on:
      - postgres
      - redis
    command: celery -A auth_project worker -l info

volumes:
  pg_data_new:
  redis_data:
