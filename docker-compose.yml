services:
  postgres:
    image: docker.io/library/postgres:17
    # container_name: postgres_prepup
    environment:
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - ./pg_data_new:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  auth_server:
    build:
      context: .
      dockerfile: auth_server/Dockerfile
    # container_name: prepup_backend
    ports:
      - "8000:8000"
    volumes:
      - ./auth_server/data:/app/auth_server/data:z
    env_file:
      - ./auth_server/api/chatbot/.env
    environment:
      - DATABASE_URL=postgresql://user:password@postgres/auth_db
      - PYTHONPATH=/app
    depends_on:
      - postgres
    command: >
      sh -c "
        echo 'Waiting for postgres...' &&
        while ! nc -z postgres 5432; do
          sleep 0.1;
        done;
        echo 'PostgreSQL started';
        alembic -c /app/auth_server/alembic.ini upgrade head &&
        uvicorn auth_server.main:app --host 0.0.0.0 --port 8000
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # container_name: prepup_frontend
    depends_on:
      - auth_server
    ports:
      - "5000:5000"
    command: nginx -g 'daemon off;'

volumes:
  pg_data_new:
