  /api/user-quiz-state/:
    get:
      operationId: user_quiz_state_retrieve
      description: Retrieves the last question index for a given test, or all quiz
        states for the user.
      tags:
      - user-quiz-state
      security:
      - tokenAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: user_quiz_state_create
      description: Updates the last question index for a given test.
      tags:
      - user-quiz-state
      security:
      - tokenAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    Bookmark:
      type: object
      description: |-
        Serializer for the Bookmark model.

        This serializer handles the conversion of Bookmark instances to JSON.
        The 'user' field is read-only and displays the user's email for
        context.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: email
          readOnly: true
        subject:
          type: string
          maxLength: 255
        question_id:
          type: string
          maxLength: 255
      required:
      - id
      - question_id
      - subject
      - user
    StudyHeartbeat:
      type: object
      description: |-
        Serializer for the study heartbeat request.

        Validates the duration sent by the frontend.
      properties:
        duration:
          type: integer
          maximum: 60
          minimum: 1
      required:
      - duration
    User:
      type: object
      description: |-
        Serializer for the User model, used for registration.

        This serializer handles the conversion of User model instances to JSON
        and validates incoming data for creating new users. The password is
        write-only to ensure it is not exposed in API responses.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        exam_type:
          type: string
          maxLength: 50
      required:
      - email
      - exam_type
      - id
      - name
      - password
    Word:
      type: object
      description: |-
        Serializer for the Word model.

        This serializer handles the conversion of Word instances to JSON.
        The 'user' field is read-only and displays the user's email for
        context.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: email
          readOnly: true
        word:
          type: string
          maxLength: 255
        meaning:
          type: string
        context:
          type: string
        question_id:
          type: string
          maxLength: 255
      required:
      - context
      - id
      - meaning
      - question_id
      - user
      - word
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
